name: Portfolio project tests
on:
  push:
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-project-tests.yml'
  pull_request:
    paths:
      - 'projects/**'
      - '.github/workflows/portfolio-project-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test vanilla JavaScript projects
        run: node --test projects/sprintboard/tests/*.test.mjs projects/expense-insights/tests/*.test.mjs
      - name: Test Python HTTP API
        working-directory: projects/issue-desk-api
        env:
          ISSUEDESK_QUIET: '1'
        run: python -m unittest discover -s tests -v
